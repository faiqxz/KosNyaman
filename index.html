<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfbf7" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Per-page SEO tags. At build time scripts/prerender.mjs replaces this whole
      block with the title, description, canonical URL, Open Graph tags and
      structured data for each page (see src/seo.ts). These defaults are only
      used by `npm run dev`.
    -->
    <!--seo-->
    <title>Kos Nyaman Bukit Baru — Kost & Kontrakan di Palembang</title>
    <meta name="description" content="Kost AC dengan kamar mandi dalam & WiFi di Bukit Baru, Palembang, dekat UNSRI Bukit Besar. Booking langsung ke pemilik via WhatsApp." />
    <!--/seo-->

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async Google Fonts: preload as style, swap on load to avoid render-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap&subset=latin" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap&subset=latin" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" />
      <!-- Without JavaScript, show content that normally fades in on scroll -->
      <style>.reveal, .hero__stat { opacity: 1 !important; transform: none !important; }</style>
    </noscript>
  </head>
  <body>
    <!-- Fixed noise grain overlay (GPU-safe: fixed + pointer-events-none) -->
    <div class="noise-layer" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
